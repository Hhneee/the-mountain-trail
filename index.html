<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Mountain Trail</title>
<meta name="description" content="A short pixel hike through Hà's work — base camp to summit.">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="rotate">
  <div>
    <div class="glyph">▭</div>
    <p>Turn your device sideways</p>
    <small>The trail is a wide one.</small>
  </div>
</div>

<div id="stage">
  <div id="frame">
    <canvas id="game" width="1280" height="720"></canvas>

    <!-- everything below is a DOM overlay laid out in the same 1280x720 space -->
    <div id="ui">

      <div id="hud" hidden>
        <div class="hud-elev">
          <img class="elev-sign" alt="">
          <span class="elev-name"></span>
        </div>
        <button class="hud-trail" type="button" aria-haspopup="dialog">
          <div class="trail-title">Trail progress</div>
          <ul class="trail-list"></ul>
        </button>
        <button id="sound" class="chip" type="button" aria-pressed="true">
          <span class="ico">♪</span><span class="lbl">Sound on</span>
        </button>
      </div>

      <div id="touch" hidden>
        <div class="joy" id="joystick">
          <div class="joy-base"></div>
          <div class="joy-knob"></div>
        </div>
      </div>

      <div id="loading">
        <div class="load-inner">
          <div class="load-name">The Mountain Trail</div>
          <div class="load-bar"><i></i></div>
        </div>
      </div>

      <div id="title" hidden>
        <div class="title-inner">
          <h1></h1>
          <p class="quote"></p>
          <button class="wood big" id="start" type="button"></button>
          <p class="hint"></p>
        </div>
      </div>

      <div id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panel-title">
        <div class="panel-card">
          <header>
            <img class="panel-icon" alt="">
            <h2 id="panel-title"></h2>
            <button class="close" type="button" aria-label="Close">✕</button>
          </header>
          <nav class="tabs" hidden></nav>
          <div class="pages"></div>
          <footer>
            <button class="arrow prev" type="button" aria-label="Previous page">‹</button>
            <div class="dots"></div>
            <button class="arrow next" type="button" aria-label="Next page">›</button>
          </footer>
          <button class="wood finish" type="button" hidden></button>
        </div>
      </div>

      <div id="map" hidden role="dialog" aria-modal="true" aria-label="Choose your destination">
        <div class="map-card">
          <img class="map-bg" alt="">
          <button class="close" type="button" aria-label="Close">✕</button>
          <div class="map-nodes"></div>
          <div class="map-progress">
            <div class="trail-title">Trail progress</div>
            <ul class="trail-list map-progress-list"></ul>
          </div>
        </div>
      </div>

      <div id="lightbox" hidden><img alt=""><button class="close" type="button" aria-label="Close">✕</button></div>

      <div id="ending" hidden>
        <div class="ending-inner">
          <p class="l1"></p>
          <p class="l2"></p>
          <button class="wood" id="again" type="button"></button>
        </div>
      </div>

      <div id="fade"></div>
    </div>
  </div>
</div>

<script src="js/paths.js"></script>
<script src="js/content.js"></script>
<script src="js/audio.js"></script>
<script src="js/ambient.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
